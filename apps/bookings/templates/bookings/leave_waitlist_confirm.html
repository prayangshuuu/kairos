{% extends "layouts/public.html" %}
{% block title %}Leave Waitlist | Kairos{% endblock %}
{% block public_content %}
<div class="max-w-2xl mx-auto py-10 px-4 text-center">
  <div class="bg-white rounded-2xl shadow-xl p-10">
    <h1 class="text-2xl font-bold mb-4">Leave the waitlist?</h1>
    <p class="text-surface-600 mb-8">Are you sure you want to be removed from the waitlist for <strong>{{ entry.event_type.title }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <div class="flex gap-4 justify-center">
        <a href="/" class="px-6 py-3 rounded-xl border border-surface-200 font-bold text-surface-700 hover:bg-surface-50">Cancel</a>
        <button type="submit" class="px-6 py-3 rounded-xl bg-red-600 text-white font-bold hover:bg-red-700">Yes, remove me</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
