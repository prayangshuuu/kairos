{% extends "layouts/public.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-surface-50 p-4">
    <div class="bg-white rounded-2xl shadow-sm border border-surface-200 p-8 sm:p-12 text-center max-w-md w-full mx-auto" style="animation: fadeInUp 0.4s ease-out forwards;">
        <div class="w-16 h-16 bg-red-50 text-red-500 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
        </div>
        <h2 class="text-2xl font-bold text-surface-900 mb-2">400 - Bad Request</h2>
        <p class="text-surface-500 mb-8">The request was invalid or could not be understood.</p>
        <a href="/" class="inline-flex items-center justify-center gap-2 px-6 py-2.5 font-medium text-white bg-brand-600 rounded-lg shadow-sm hover:bg-brand-700 transition-colors">
            Return Home
        </a>
    </div>
</div>
<style>
    @keyframes fadeInUp {{
        from {{ opacity: 0; transform: translateY(10px); }}
        to {{ opacity: 1; transform: translateY(0); }}
    }}
</style>
{% endblock %}
