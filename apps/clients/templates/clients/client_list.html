{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-8">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold text-gray-900">Clients</h1>
  </div>

  <div class="bg-white shadow overflow-hidden sm:rounded-lg">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-gray-50">
        <tr>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Bookings</th>
          <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Last Seen</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        {% for client in clients %}
        <tr>
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
            <a href="{% url 'clients:detail' client.pk %}" class="text-indigo-600 hover:text-indigo-900">{{ client.name }}</a>
          </td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ client.email }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ client.total_bookings|default:"0" }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ client.last_seen_at|date:"Y-m-d" }}</td>
        </tr>
        {% empty %}
        <tr>
          <td colspan="4" class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center">No clients found.</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
