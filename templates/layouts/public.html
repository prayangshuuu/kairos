{% extends "base.html" %}

{% block extra_head %}
<style>
  :root {
    --teal-50:  #f0fdfa;
    --teal-100: #ccfbf1;
    --teal-200: #99f6e4;
    --teal-300: #5eead4;
    --teal-400: #2dd4bf;
    --teal-500: #14b8a6;
    --teal-600: #0d9488;
    --teal-700: #0f766e;
    --teal-800: #115e59;
    --teal-900: #134e4a;
    --teal-950: #042f2e;
    --dark:     #060d0c;
    --dark-2:   #0a1412;
    --dark-3:   #0f1f1c;
  }
</style>
{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col bg-surface-50">

    {% include "partials/_navbar.html" %}

    <!-- Main public content area, centered -->
    <main class="flex-grow flex flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8" style="padding-top: 100px;">
        <div class="w-full max-w-6xl">
            {% block public_content %}{% endblock %}
        </div>
    </main>

    {% include "partials/_footer.html" %}

</div>
{% endblock %}
