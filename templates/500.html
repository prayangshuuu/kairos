<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error - Kairos</title>
    <!-- Basic styling since static files might not be reliable in 500 -->
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #f8fafc; color: #0f172a; text-align: center; display: flex; flex-direction: column; min-height: 100vh; margin: 0; }
        main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem; }
        h1 { font-size: 6rem; margin: 0; color: #0d9488; }
        h2 { font-size: 2rem; margin-top: 1rem; }
        p { color: #475569; }
        footer { padding: 1.5rem; color: #94a3b8; font-size: 0.875rem; }
    </style>
</head>
<body>
    <main>
        <h1>500</h1>
        <h2>Internal Server Error</h2>
        <p>Something went wrong on our end. We've been notified and are looking into it.</p>
    </main>
    <footer>
        Powered by Kairos
    </footer>
</body>
</html>
