{% extends "layouts/app.html" %}

{% block title %}Settings - Kairos{% endblock %}

{% block app_content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 py-6">
    <div class="lg:grid lg:grid-cols-12 lg:gap-x-5">
        <aside class="py-6 px-2 sm:px-6 lg:py-0 lg:px-0 lg:col-span-3">
            <nav class="space-y-1">
                <a href="{% url 'accounts:settings_profile' %}" class="{% if request.path == '/settings/' %}bg-gray-50 text-brand-700 hover:text-brand-700 hover:bg-white{% else %}text-gray-900 hover:text-gray-900 hover:bg-gray-50{% endif %} group rounded-md px-3 py-2 flex items-center text-sm font-medium">
                    Profile
                </a>
                <a href="{% url 'accounts:settings_preferences' %}" class="{% if request.path == '/settings/preferences/' %}bg-gray-50 text-brand-700 hover:text-brand-700 hover:bg-white{% else %}text-gray-900 hover:text-gray-900 hover:bg-gray-50{% endif %} group rounded-md px-3 py-2 flex items-center text-sm font-medium">
                    Preferences
                </a>
                <a href="{% url 'accounts:settings_security' %}" class="{% if request.path == '/settings/security/' %}bg-gray-50 text-brand-700 hover:text-brand-700 hover:bg-white{% else %}text-gray-900 hover:text-gray-900 hover:bg-gray-50{% endif %} group rounded-md px-3 py-2 flex items-center text-sm font-medium">
                    Security
                </a>
                <a href="{% url 'accounts:settings_branding' %}" class="{% if request.path == '/settings/branding/' %}bg-gray-50 text-brand-700 hover:text-brand-700 hover:bg-white{% else %}text-gray-900 hover:text-gray-900 hover:bg-gray-50{% endif %} group rounded-md px-3 py-2 flex items-center text-sm font-medium">
                    Branding
                </a>
                <a href="{% url 'accounts:settings_danger' %}" class="{% if request.path == '/settings/danger/' %}bg-red-50 text-red-700 hover:text-red-700 hover:bg-white{% else %}text-gray-900 hover:text-gray-900 hover:bg-gray-50{% endif %} group rounded-md px-3 py-2 flex items-center text-sm font-medium">
                    Danger Zone
                </a>
            </nav>
        </aside>

        <div class="space-y-6 sm:px-6 lg:px-0 lg:col-span-9">
            <div id="settings-messages"></div>
            {% block settings_content %}{% endblock %}
        </div>
    </div>
</div>
{% endblock %}
