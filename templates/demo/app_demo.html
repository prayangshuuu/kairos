{% extends "layouts/app.html" %}

{% block app_content %}
<div class="card p-6">
    <h2 class="text-2xl font-bold mb-4">Dashboard Demo</h2>
    <p class="mb-6 text-surface-600">This layout is for the internal logged-in dashboard.</p>
    
    <div id="demo-target" class="p-4 border border-dashed border-surface-300 rounded-md mb-6">
        <p class="text-surface-500 text-sm">Content will be swapped here.</p>
    </div>
    
    <button class="btn btn-primary" hx-post="{% url 'demo:partial' %}" hx-target="#demo-target" hx-swap="innerHTML">
        Load HTMX Partial & Toast
    </button>
</div>
{% endblock %}
