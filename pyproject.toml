[project]
name = "kairos"
version = "0.1.0"
description = "Scheduling and paid-appointments platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "psycopg[binary]",
    "django-environ",
    "celery",
    "redis",
    "django-allauth[socialaccount]",
    "icalendar",
    "pillow>=12.3.0",
    "django-ratelimit>=4.1.0",
    "django-csp>=4.0",
    "sentry-sdk>=2.67.1",
    "django-structlog>=10.1.0",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-cov>=7.1.0",
    "factory-boy>=3.3.3",
    "pre-commit>=4.6.2",
    "pytest-factoryboy>=2.8.1",
    "django-cryptography>=1.1",
    "requests>=2.34.2",
    "django-fernet-encrypted-fields>=0.4.0",
    "google-api-python-client>=2.198.0",
    "google-auth-oauthlib>=1.4.0",
    "paystation>=1.1.0",
    "django-htmx>=1.19.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-django",
    "pytest-cov",
    "ruff",
    "django-debug-toolbar",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "DJ"]
ignore = []

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
testpaths = ["apps"]
python_files = ["tests.py", "test_*.py", "*_tests.py"]
