{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex flex-col bg-surface-50">
    <!-- Main public content area, centered -->
    <main class="flex-grow flex flex-col items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
        <div class="w-full max-w-3xl">
            {% block public_content %}{% endblock %}
        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center">
        <a href="/" class="text-sm text-surface-400 hover:text-surface-600 font-medium transition-colors">
            Powered by Kairos
        </a>
    </footer>
</div>
{% endblock %}
