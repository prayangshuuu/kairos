<!-- Out of band swap for toasts -->
<div id="toast-container" hx-swap-oob="beforeend">
    {% if messages %}
        {% for message in messages %}
            <div x-data="{ show: true }" 
                 x-show="show" 
                 x-init="setTimeout(() => show = false, 5000)"
                 x-transition.duration.300ms
                 class="flex items-center justify-between p-4 mb-2 text-sm rounded-lg shadow-md
                    {% if message.level_tag == 'success' %}bg-green-50 text-green-800 border border-green-200
                    {% elif message.level_tag == 'error' %}bg-red-50 text-red-800 border border-red-200
                    {% elif message.level_tag == 'warning' %}bg-yellow-50 text-yellow-800 border border-yellow-200
                    {% else %}bg-blue-50 text-blue-800 border border-blue-200{% endif %}"
                 role="alert">
                <div>{{ message }}</div>
                <button @click="show = false" class="ml-auto -mx-1.5 -my-1.5 rounded-lg focus:ring-2 p-1.5 inline-flex h-8 w-8 hover:bg-black/5">
                    <span class="sr-only">Close</span>
                    <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"></path></svg>
                </button>
            </div>
        {% endfor %}
    {% endif %}
</div>
