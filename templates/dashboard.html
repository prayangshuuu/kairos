{% extends "layouts/app.html" %}

{% block title %}Dashboard - Kairos{% endblock %}

{% block app_content %}
<div class="max-w-7xl mx-auto px-4 sm:px-6 md:px-8 py-6">
    <h1 class="text-2xl font-semibold text-gray-900">Dashboard</h1>
    <div class="mt-4">
        <p class="text-gray-600">Welcome to Kairos, {{ user.display_name|default:user.email }}!</p>
        <p class="text-gray-600 mt-2">Your booking link is: <a href="{% url 'home' %}{{ user.slug }}" class="text-blue-600 hover:underline">joinkairos.me/{{ user.slug }}</a></p>
    </div>
</div>
{% endblock %}
