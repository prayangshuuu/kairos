{% load tz %}

<div id="slots-partial" class="w-full h-full flex flex-col" aria-live="polite">
  {% if selected_date %}
    <h3 class="text-base font-medium text-surface-900 mb-6 sticky top-0 bg-surface-50 z-10">{{ selected_date|date:"l, F j" }}</h3>
    
    {% if day_slots %}
      <div class="flex-grow overflow-y-auto pr-2 space-y-3 pb-8">
        {% timezone visitor_tz %}
          {% for slot in day_slots %}
            <button 
              hx-post="{% url 'bookings:booking_stub' host_slug=host.slug event_slug=event.slug %}"
              hx-target="this"
              hx-swap="outerHTML"
              class="w-full py-3.5 px-4 border border-primary-600 text-primary-700 rounded-lg text-sm font-semibold hover:border-primary-700 hover:bg-primary-50 transition-colors focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2 flex justify-center items-center bg-white"
            >
              {{ slot|time:"g:i A" }}
            </button>
          {% endfor %}
        {% endtimezone %}
      </div>
    {% else %}
      <div class="flex flex-col items-center justify-center mt-12 text-surface-500">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="mb-4 opacity-50"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <p class="mb-4 text-sm">No times available.</p>
      </div>
    {% endif %}
  {% else %}
    <div class="flex items-center justify-center mt-12 text-surface-500 text-sm">
      <p>No available days in this month.</p>
    </div>
  {% endif %}
</div>
