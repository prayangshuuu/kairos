{% extends "layouts/public.html" %}

{% block content %}
<div class="max-w-md mx-auto py-12 px-4 sm:px-6 lg:px-8">
  <div class="bg-white p-8 rounded-2xl shadow-xl border border-surface-200">
    <h2 class="text-2xl font-bold text-surface-900 mb-4">Approve Booking?</h2>
    <p class="text-surface-600 mb-6">
      You are about to approve the meeting with <strong>{{ booking.invitee_name }}</strong> 
      on <strong>{{ booking.start_at|date:"l, F j, Y \a\t g:i A" }}</strong>.
    </p>
    
    <form method="POST">
      {% csrf_token %}
      <div class="flex flex-col space-y-3">
        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-primary-600 hover:bg-primary-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary-500">
          Confirm Approval
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
