{% extends "emails/base.html" %}

{% block preheader %}Welcome to Kairos!{% endblock %}

{% block content %}
<table width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td style="padding-bottom: 24px;">
            <h1 style="margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 24px; font-weight: 600; color: #111827;">Welcome to Kairos!</h1>
        </td>
    </tr>
    <tr>
        <td style="padding-bottom: 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px; color: #374151;">
            Hi {{ user_name|default:"there" }},
            <br><br>
            We are excited to have you on board. Kairos is your all-in-one scheduling platform.
        </td>
    </tr>
    <tr>
        <td style="padding-top: 16px; padding-bottom: 24px;">
            <table cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td style="border-radius: 4px; background-color: {{ branding_color|default:'#000000' }}; text-align: center;">
                        <a href="{{ dashboard_url|default:'https://kairos.app/dashboard' }}" style="display: inline-block; padding: 12px 24px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 500; color: #ffffff; text-decoration: none; border-radius: 4px;">Go to Dashboard</a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
{% endblock %}
