{% extends "layouts/public.html" %}
{% load i18n %}

{% block title %}{% trans "Change Password Successful" %} - Kairos{% endblock %}

{% block public_content %}
<div class="min-h-screen bg-surface-50 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-4 shadow sm:rounded-lg sm:px-10 text-center">
            <h2 class="text-2xl font-bold text-surface-900 mb-4">{% trans "Password Changed!" %}</h2>
            <p class="text-surface-600 mb-6">
                {% trans "Your password is now changed." %}
            </p>
            <a href="{% url 'account_login' %}" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-500">
                {% trans "Log In" %}
            </a>
        </div>
    </div>
</div>
{% endblock %}
