{% extends "layouts/public.html" %}

{% block public_content %}
<div class="card p-8 text-center">
    <h2 class="text-3xl font-bold mb-4">Public Booking Demo</h2>
    <p class="mb-8 text-surface-600">This layout is for the public booking pages that strangers see.</p>
    
    <div id="demo-target" class="p-4 border border-dashed border-surface-300 rounded-md mb-6 inline-block w-full">
        <p class="text-surface-500 text-sm">Content will be swapped here.</p>
    </div>
    
    <div>
        <button class="btn btn-secondary" hx-post="{% url 'demo:partial' %}" hx-target="#demo-target" hx-swap="innerHTML">
            Load HTMX Partial & Toast
        </button>
    </div>
</div>
{% endblock %}
